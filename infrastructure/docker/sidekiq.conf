# Sidekiq process configuration for Docker containers
# Version: 1.0.0
# runit ~> 2.1.2

# Process user and group settings
env SIDEKIQ_USER=app
env SIDEKIQ_GROUP=app
env SIDEKIQ_TIMEOUT=30
env SIDEKIQ_ENVIRONMENT=production
env SIDEKIQ_MAX_MEMORY=2048
env SIDEKIQ_CPU_SHARES=1024
env SIDEKIQ_LOG_LEVEL=info

# Process supervision configuration
check process sidekiq
  with pidfile /tmp/sidekiq.pid
  start program = "/app/bin/pre_start.sh" with timeout 60 seconds
  stop program = "/app/bin/post_stop.sh" with timeout 35 seconds
  if totalmem > 2048 MB for 3 cycles then restart
  if cpu > 95% for 5 cycles then alert
  if failed port 7433 protocol http
    and request /health with timeout 5 seconds
    then restart

# Process environment setup
env {
  RAILS_ENV="production"
  MALLOC_ARENA_MAX=2
  RAILS_MAX_THREADS=25
  RAILS_MIN_THREADS=5
  RUBY_GC_HEAP_GROWTH_MAX_SLOTS=40000
  RUBY_GC_HEAP_INIT_SLOTS=400000
  RUBY_GC_HEAP_GROWTH_FACTOR=1.1
}

# Resource limits
ulimit {
  -n 65535    # max file descriptors
  -u unlimited # max user processes
  -c unlimited # core file size
  -e 0        # scheduling priority
  -f unlimited # file size
  -d 2097152  # data seg size
  -m 2097152  # max memory size
  -t unlimited # cpu time
  -v 2097152  # virtual memory
}

# Process directory setup
directory /app
umask 0027
chdir /app

# Process execution
script
  exec 2>&1
  exec chpst -u ${SIDEKIQ_USER}:${SIDEKIQ_GROUP} \
    -L ${SIDEKIQ_MAX_MEMORY} \
    -P ${SIDEKIQ_CPU_SHARES} \
    bundle exec sidekiq \
      -e ${SIDEKIQ_ENVIRONMENT} \
      -C config/sidekiq.yml \
      -r ./config/boot.rb \
      -P /tmp/sidekiq.pid \
      -L /var/log/sidekiq/sidekiq.log
end script

# Logging configuration
logging {
  file /var/log/sidekiq/sidekiq.log {
    format json
    rotate 10
    size 100M
    compress
    delaycompress
    missingok
    notifempty
    create 0640 ${SIDEKIQ_USER} ${SIDEKIQ_GROUP}
  }
}

# Process monitoring
check {
  if memory > ${SIDEKIQ_MAX_MEMORY}MB then exec "/app/bin/memory_exceeded.sh"
  if cpu > ${SIDEKIQ_CPU_SHARES} for 5 cycles then exec "/app/bin/cpu_exceeded.sh"
  if failed host 127.0.0.1 port 7433 protocol http 
    and url /health 
    timeout 5 seconds 
    then restart
  if 3 restarts within 5 cycles then timeout
}

# StatsD metrics configuration
metrics {
  statsd {
    host = "localhost"
    port = 8125
    prefix = "sidekiq"
    flush_interval = 60
  }
  
  include [
    "queue_size",
    "process_count",
    "memory_usage",
    "gc_stats"
  ]
}

# Health check endpoint
health {
  port = 7433
  endpoint = "/health"
  timeout = 5
  interval = 5
  rise = 2
  fall = 3
}

# Process supervision
supervision {
  mode = "active"
  strategy = "all"
  restart {
    limit = 5
    interval = 300
  }
  stop {
    timeout = ${SIDEKIQ_TIMEOUT}
    signal = TERM
    force_timeout = 5
  }
}

# Core dump configuration
coredump {
  directory = "/var/cores"
  pattern = "core.%e.%p.%h.%t"
  limit = unlimited
}

# IO configuration
io {
  weight = 500
  max_connections = 1000
  read_ahead = 64K
  write_throttle = 50M
}

# OOM protection
oom {
  score_adj = -500
  never_kill = true
}